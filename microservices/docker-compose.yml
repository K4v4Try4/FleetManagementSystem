services:
  # --- DATABASE ---
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fleet-db
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_Password_123
      - MSSQL_PID=Developer
    networks:
      - fleet-network

  # --- MESSAGING INFRASTRUCTURE ---
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - fleet-network

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Listener utilizzato dai container sulla rete Docker
      # e da eventuali client esterni all'host.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092

      # Associa ciascun listener al relativo protocollo.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Fattore di replica minimo adeguato a un ambiente locale
      # con un solo broker Kafka.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      # Consente la creazione automatica dei topic non esistenti.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true

    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - fleet-network

  kafka-init:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka-init

    # Job temporaneo eseguito una sola volta per creare
    # i topic richiesti dall'applicazione.
    depends_on:
      kafka:
        condition: service_healthy

    entrypoint:
      - bash
      - -c
      - |
        set -e

        echo "Waiting for Kafka..."

        until kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do
          echo "Kafka not ready..."
          sleep 3
        done

        echo "Creating topic..."

        kafka-topics --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic trip-completed-topic \
          --partitions 1 \
          --replication-factor 1

        echo "Done"

    networks:
      - fleet-network

  # --- CAR SERVICE ---
  car-service:
    image: car-service-api
    container_name: car-service-app

    build:
      context: .
      dockerfile: CarService/CarService.WebApi/Dockerfile

    ports:
      - "5000:8080"

    environment:
      - ASPNETCORE_ENVIRONMENT=Development

      # Connessione al database condiviso SQL Server.
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=CarDb;User Id=sa;Password=Your_Password_123;TrustServerCertificate=True;

      # Endpoint Kafka raggiungibile tramite DNS Docker.
      - Kafka__BootstrapServers=kafka:9092

    depends_on:
      kafka:
        condition: service_healthy

      # Garantisce che il topic richiesto esista prima dell'avvio.
      kafka-init:
        condition: service_completed_successfully

    networks:
      - fleet-network

  # --- EMPLOYEE SERVICE ---
  employee-service:
    image: employee-service-api
    container_name: employee-service-app

    build:
      context: .
      dockerfile: EmployeeService/EmployeeService.WebApi/Dockerfile

    ports:
      - "5001:8080"

    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=EmployeeDb;User Id=sa;Password=Your_Password_123;TrustServerCertificate=True;
      - Kafka__BootstrapServers=kafka:9092

    depends_on:
      kafka:
        condition: service_healthy

      kafka-init:
        condition: service_completed_successfully

    networks:
      - fleet-network

  # --- BOOKING SERVICE ---
  booking-service:
    image: booking-service-api
    container_name: booking-service-app

    build:
      context: ../
      dockerfile: microservices/BookingService/BookingService.WebApi/Dockerfile

      args:
        # Token utilizzato durante la build per accedere
        # a eventuali feed NuGet privati.
        - NUGET_AUTH_TOKEN=${NUGET_AUTH_TOKEN}

    ports:
      - "5002:8080"

    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=BookingDb;User Id=sa;Password=Your_Password_123;TrustServerCertificate=True;
      - Kafka__BootstrapServers=kafka:9092

      # Comunicazione interna tra microservizi tramite
      # il DNS fornito dalla rete Docker.
      - ExternalServices__CarServiceUrl=http://car-service:8080
      - ExternalServices__EmployeeServiceUrl=http://employee-service:8080

    depends_on:
      kafka:
        condition: service_healthy

      kafka-init:
        condition: service_completed_successfully

      car-service:
        condition: service_started

      employee-service:
        condition: service_started

    networks:
      - fleet-network

# --- NETWORKING ---
networks:
  fleet-network:
    # Rete privata condivisa da tutti i servizi del sistema.
    driver: bridge 